[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ta_patterns"
version = "1.2.0"
description = "Pure-numpy vectorised library of 300 candlestick and chart pattern detectors with no look-forward bias."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ta_patterns contributors" }]
keywords = [
    "technical-analysis", "candlestick", "chart-patterns", "trading",
    "finance", "harmonic-patterns", "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7.0", "pandas>=1.5"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]

[project.urls]
Homepage = "https://github.com/AdventuresInDataScience/ta_patterns"
Source = "https://github.com/AdventuresInDataScience/ta_patterns"
Issues = "https://github.com/AdventuresInDataScience/ta_patterns/issues"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
# src: import the package straight from src/ without an editable install.
# ".": the suite imports its helpers as `tests.synthetic`, so the repo root must
# be importable.  Bare `pytest` does not add the working directory to sys.path
# (only `python -m pytest` does), so without this the whole suite fails to
# collect under the documented invocation.
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
