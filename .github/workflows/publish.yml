name: Publish to PyPI

# Fires when a version tag is pushed.  Publishing uses PyPI Trusted Publishing
# (OIDC), so there is no API token stored in repository secrets.
#
# One-time setup on pypi.org, under the project's Publishing settings, add a
# trusted publisher:
#   Owner:          AdventuresInDataScience
#   Repository:     ta_patterns
#   Workflow name:  publish.yml
#   Environment:    (leave blank)
#
# workflow_dispatch is here so a tag that was pushed before this workflow
# existed can still be released, by running it manually against that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # matches pyproject classifiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refuse to publish a tag whose name disagrees with the packaged version.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
